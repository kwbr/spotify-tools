[project]
name = "spotify-tools"
version = "0.16"
description = "Various tools working with Spotify"
readme = "README.md"
authors = [{name = "Kai Weber"}]
license = {text = "Apache-2.0"}
requires-python = ">=3.13"
dependencies = [
    "click>=8.4.2",
    "spotipy>=2.26.0",
]

[build-system]
requires = ["setuptools>=82.0.1", "wheel>=0.45.1"]
build-backend = "setuptools.build_meta"

[project.scripts]
spt = "spotify_tools.cli:cli"

[project.urls]
Homepage = "https://github.com/kwbr/spotify-tools"
Changelog = "https://github.com/kwbr/spotify-tools/releases"
Issues = "https://github.com/kwbr/spotify-tools/issues"

[dependency-groups]
dev = [
    "pyright>=1.1.391",
    "pytest>=9.0.3",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.16",
]

[tool.pyright]
include = ["src"]
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false

[tool.ruff.lint]
select = [
    "B",        # Bugbear catches common design problems
    "C4",       # Catch incorrect use of comprehensions, dict, list, etc
    "E",        # PyCodeStyle errors
    "F",        # Pyflakes rules
    "FA",       # Enforce from __future__ import annotations
    "I",        # Sort imports properly
    "ICN",      # Use common import conventions
    "ISC",      # Good use of string concatenation
    "N",        # PEP 8 naming conventions
    "NPY",      # Some numpy-specific things
    "PTH",      # Use pathlib instead of os.path
    "RET",      # Good return practices
    "RUF",      # Ruff-specific rules
    "S",        # Security checks
    "SIM",      # Common simplification rules
    "TC",       # Enforce importing certain types in a TYPE_CHECKING block
    "TD",       # Be diligent with TODO comments
    "TID",      # Some good import practices
    "UP",       # Warn if certain things can changed due to newer Python versions
    "W",        # PyCodeStyle warnings
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",     # Pytest uses assert for test expectations
    "S105",     # Test fixtures intentionally contain fake secrets
    "S106",     # Test fixtures intentionally pass fake secrets
]
